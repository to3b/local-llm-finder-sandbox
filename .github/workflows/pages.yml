name: Sandbox Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sandbox-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox controls
        uses: actions/checkout@v4
        with:
          path: sandbox

      - name: Checkout known-good production snapshot
        uses: actions/checkout@v4
        with:
          repository: to3b/local-llm-finder
          ref: 9eaad0eb611760802093bc52983adb8927785fad
          path: site

      - name: Checkout Knowledge preview snapshot
        uses: actions/checkout@v4
        with:
          repository: to3b/local-llm-finder-knowledge
          ref: 51aa6dbaf6f087de4b99bebbd271476b8238d82a
          path: knowledge

      - name: Build editable Knowledge pages from the content Sheet
        working-directory: knowledge
        run: node scripts/build-articles.mjs

      - name: Test Knowledge relationships
        working-directory: knowledge
        run: |
          node tests/wiki.test.mjs
          node tests/article-build.test.mjs

      - name: Apply sandbox overrides
        run: |
          if [ -d sandbox/overrides ]; then
            rsync -a --exclude 'README.md' sandbox/overrides/ site/
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run production regression suite against sandbox baseline
        working-directory: site
        run: npm test

      - name: Apply build-time sandbox refinement
        run: |
          rsync -a --exclude '.git' --exclude 'CNAME' knowledge/ site/knowledge-preview/
          node sandbox/scripts/prepare-sandbox.mjs site

      - name: Recheck recommendation and data contracts after cleanup
        working-directory: site
        run: npm test

      - name: Prepare isolated staging build
        run: |
          rm -f site/CNAME site/sitemap.xml site/dist/sitemap.xml site/knowledge-preview/sitemap.xml
          printf 'User-agent: *\nAllow: /\n' > site/robots.txt
          printf 'User-agent: *\nAllow: /\n' > site/dist/robots.txt
          find site -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's/<meta name="robots" content="[^"]*">/<meta name="robots" content="noindex,nofollow">/g' \
            -e 's|href="/"|href="/local-llm-finder-sandbox/"|g'
          touch site/.nojekyll

      - name: Run sandbox first-paint and interaction smoke checks
        run: |
          node sandbox/scripts/check-sandbox.mjs site
          node sandbox/scripts/check-draft-pages.mjs site

      - name: Install browser smoke dependency
        run: python3 -m pip install --quiet 'selenium>=4.20,<5'

      - name: Run real-browser interaction regression
        run: |
          mkdir -p runtime-root
          ln -sfn "$PWD/site" runtime-root/local-llm-finder-sandbox
          python3 -m http.server 4173 --directory runtime-root >/tmp/local-llm-sandbox-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/local-llm-finder-sandbox/ >/dev/null; then break; fi
            sleep 0.2
          done
          python3 sandbox/scripts/browser-smoke.py http://127.0.0.1:4173/local-llm-finder-sandbox/

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: browser-evidence/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
